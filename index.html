/* ========== AMOS WEB (real SEM / CFA estimation) ========== */
const AMKEY="statlab-amos";
let AM=null;
function amDefault(){return{factors:[],paths:[],ecov:[],fcov:[],covExo:true,est:"ML",out:{std:true,smc:true,mi:true,miT:4,sample:false,implied:false,resid:false,effects:true,normal:true},show:"std",zoom:1,res:null}}
function amLoad(){try{AM=JSON.parse(localStorage.getItem(AMKEY)||"null")}catch(e){AM=null}if(!AM||!Array.isArray(AM.factors))AM=amDefault();AM.res=null}
function amSave(){try{const c={...AM,res:null};localStorage.setItem(AMKEY,JSON.stringify(c))}catch(e){}}
function amSampleData(){let s=987;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};const g=()=>{const u=rnd()||.5,v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
 const ds={name:"AMOS_sample",vars:[],rows:[]};const V=(n,l)=>{const v=newVar(n);v.label=l;v.dec=0;v.measure="ordinal";ds.vars.push(v)};
 ["a1","a2","a3","a4"].forEach((n,i)=>V(n,"بند القلق "+(i+1)));["d1","d2","d3","d4"].forEach((n,i)=>V(n,"بند الاكتئاب "+(i+1)));["s1","s2","s3"].forEach((n,i)=>V(n,"بند المساندة "+(i+1)));const ach=newVar("achieve");ach.label="التحصيل";ach.dec=1;ds.vars.push(ach);
 const lam=[.78,.72,.81,.66,.75,.83,.69,.71,.8,.74,.68];const cl=x=>Math.max(1,Math.min(5,Math.round(3+1.1*x)));
 for(let i=0;i<320;i++){const S=g(),A=-.35*S+Math.sqrt(1-.1225)*g(),D=.55*A-.2*S+.75*g(),ac=70-4.2*D+2.5*S+7*g();const F=[A,A,A,A,D,D,D,D,S,S,S];ds.rows.push([...F.map((f,k)=>cl(lam[k]*f/ (k<4?1:k<8?1.12:1)+Math.sqrt(1-lam[k]**2)*g())),Math.round(ac*10)/10])}
 return ds}
/* --- engine --- */
function amSpec(){const F=AM.factors.filter(f=>f.items.length&&f.items.every(j=>DS.vars[j]&&DS.vars[j].type==="n"));if(!F.length)throw new Error("عرّف عاملًا واحدًا على الأقل ببنوده (Draw Unobserved ثم Draw Indicator).");
 const obs=[];F.forEach(f=>f.items.forEach(j=>{if(obs.includes(j))throw new Error(`المتغير ${DS.vars[j].name} مستخدم في أكثر من عامل.`);obs.push(j)}));
 const fi=new Map(AM.factors.map((f,i)=>[i,F.indexOf(f)]));const paths=AM.paths.map(p=>({from:fi.get(p.from),to:fi.get(p.to)})).filter(p=>p.from>=0&&p.to>=0&&p.from!==p.to);
 const m=F.length,endo=new Set(paths.map(p=>p.to));return{F,obs,m,p:obs.length,paths,endo}}
function amBuildParams(sp,S){const P=[],oi=j=>sp.obs.indexOf(j);
 sp.F.forEach((f,fi)=>{f.items.forEach((j,k)=>{if(k>0)P.push({t:"L",i:oi(j),f:fi,lab:`${DS.vars[j].name} <--- ${f.name}`})})});
 sp.paths.forEach(p=>P.push({t:"B",to:p.to,from:p.from,lab:`${sp.F[p.to].name} <--- ${sp.F[p.from].name}`}));
 sp.F.forEach((f,fi)=>P.push({t:"P",a:fi,b:fi,lab:sp.endo.has(fi)?`res_${f.name}`:f.name}));
 const exo=sp.F.map((_,i)=>i).filter(i=>!sp.endo.has(i));const fc=new Set((AM.fcov||[]).map(x=>x.join("-")));
 for(let a=0;a<exo.length;a++)for(let b=a+1;b<exo.length;b++){const A=exo[a],Bb=exo[b];const ia=AM.factors.indexOf(sp.F[A]),ib=AM.factors.indexOf(sp.F[Bb]);if(AM.covExo||fc.has(ia+"-"+ib)||fc.has(ib+"-"+ia))P.push({t:"P",a:A,b:Bb,lab:`${sp.F[A].name} <--> ${sp.F[Bb].name}`})}
 sp.F.forEach(f=>{if(f.items.length>1)f.items.forEach(j=>P.push({t:"T",a:oi(j),b:oi(j),lab:"e_"+DS.vars[j].name}))});
 (AM.ecov||[]).forEach(([x,y])=>{const a=oi(x),b=oi(y);if(a>=0&&b>=0&&a!==b)P.push({t:"T",a,b,lab:`e_${DS.vars[x].name} <--> e_${DS.vars[y].name}`})});
 const th0=P.map(q=>{if(q.t==="L"){const f=sp.F[q.f],mk=oi(f.items[0]);const phi=Math.max(.05,.6*S[mk][mk]);return Math.max(-3,Math.min(3,S[q.i][mk]/phi))}if(q.t==="B")return 0;if(q.t==="P"){if(q.a!==q.b)return 0;const f=sp.F[q.a],mk=oi(f.items[0]);return f.items.length===1?S[mk][mk]*(sp.endo.has(q.a)?.6:1):Math.max(.05,.6*S[mk][mk])}if(q.t==="T")return q.a===q.b?.5*S[q.a][q.a]:0});
 return{P,th0}}
function amMatrices(sp,P,th){const p=sp.p,m=sp.m,L=LA.zeros(p,m),B=LA.zeros(m,m),Psi=LA.zeros(m,m),Th=LA.zeros(p,p),oi=j=>sp.obs.indexOf(j);
 sp.F.forEach((f,fi)=>L[oi(f.items[0])][fi]=1);
 P.forEach((q,k)=>{const v=th[k];if(q.t==="L")L[q.i][q.f]=v;else if(q.t==="B")B[q.to][q.from]=v;else if(q.t==="P"){Psi[q.a][q.b]=v;Psi[q.b][q.a]=v}else{Th[q.a][q.b]=v;Th[q.b][q.a]=v}});
 const IB=LA.zeros(m,m);for(let i=0;i<m;i++)for(let j=0;j<m;j++)IB[i][j]=(i===j?1:0)-B[i][j];const A=LA.inv(IB);if(!A)return null;const Phi=LA.mul(LA.mul(A,Psi),LA.T(A));const Sig=LA.mul(LA.mul(L,Phi),LA.T(L));for(let i=0;i<p;i++)for(let j=0;j<p;j++)Sig[i][j]+=Th[i][j];return{L,B,Psi,Th,A,Phi,Sig}}
function amObjective(est,S,Si,ldS,p){return Sig=>{if(est==="ULS"){let f=0;for(let i=0;i<p;i++)for(let j=0;j<p;j++)f+=(S[i][j]-Sig[i][j])**2;return{f:f/2,G:Sig.map((r,i)=>r.map((x,j)=>x-S[i][j]))}}
 if(est==="GLS"){const D=S.map((r,i)=>r.map((x,j)=>x-Sig[i][j])),M=LA.mul(Si,D);let f=0;for(let i=0;i<p;i++)for(let j=0;j<p;j++)f+=M[i][j]*M[j][i];const W=LA.mul(M,Si);return{f:f/2,G:W.map(r=>r.map(x=>-x))}}
 const ld=LA.logdet(Sig);if(!isFinite(ld))return{f:Infinity};const Wi=LA.inv(Sig);if(!Wi)return{f:Infinity};const WS=LA.mul(Wi,S);let tr=0;for(let i=0;i<p;i++)tr+=WS[i][i];const WSW=LA.mul(WS,Wi);return{f:ld+tr-ldS-p,G:Wi.map((r,i)=>r.map((x,j)=>x-WSW[i][j])),Wi}}}
function amDeltas(sp,P,th){const h=1e-6;return P.map((_,k)=>{const a=th.slice(),b=th.slice(),hk=h*Math.max(1,Math.abs(th[k]));a[k]+=hk;b[k]-=hk;const Ma=amMatrices(sp,P,a),Mb=amMatrices(sp,P,b);return Ma.Sig.map((r,i)=>r.map((x,j)=>(x-Mb.Sig[i][j])/(2*hk)))})}
const trProd=(A,B)=>{let s=0;for(let i=0;i<A.length;i++)for(let j=0;j<A.length;j++)s+=A[i][j]*B[j][i];return s};
const sumHad=(A,B)=>{let s=0;for(let i=0;i<A.length;i++)for(let j=0;j<A.length;j++)s+=A[i][j]*B[i][j];return s};
function ncChiCdf(x,df,lam){if(lam<=0)return 1-chiP(x,df);let s=0,w=Math.exp(-lam/2),j=0;for(;j<2000;j++){if(j>0)w*=lam/2/j;s+=w*(1-chiP(x,df+2*j));if(j>lam/2&&w<1e-12)break}return s}

function simulate(items,n,binary,steps){

 return rows;
}

 <div class="spss"><div class="tb"><i></i>IBM SPSS Amos Graphics — CFA_model.amw</div><div class="menu">${["File","Edit","View","Diagram","Analyze","Tools","Plugins"].map(m=>`<button data-am="${m}">${m}</button>`).join("")}</div><div style="padding:6px;overflow-x:auto"><svg viewBox="0 0 640 380" style="width:100%;min-width:480px;display:block;font-family:Segoe UI,Tahoma,sans-serif;font-size:13px" id="amsvg">${g}</svg></div></div>
 <div class="expl" id="amx">اضغط على عنصر في النموذج، أو على قائمة بالأعلى.</div></div>
 <div class="panel"><h3>Text Output: Standardized Regression Weights</h3><div class="otwrap"><table class="otbl"><thead><tr><th></th><th></th><th></th><th>Estimate</th></tr></thead><tbody>${F.flatMap(f=>f.it.map(it=>`<tr><td>${it[0]}</td><td>&lt;---</td><td>${f.n==="القلق"?"Anxiety":"Depression"}</td><td>${f2(it[1],3).replace(/^0/,"")}</td></tr>`)).join("")}</tbody></table>
